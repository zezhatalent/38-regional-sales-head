name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build if Node project
        run: |
          if [ -f package.json ]; then
            npm install --legacy-peer-deps || npm install
            if grep -q "vite build" package.json || [ -f vite.config.ts ] || [ -f vite.config.js ]; then
              npx vite build --base=./
            else
              npm run build || true
            fi
            if [ -d dist ]; then
              echo "UPLOAD_DIR=./dist" >> $GITHUB_ENV
            else
              echo "UPLOAD_DIR=." >> $GITHUB_ENV
            fi
          else
            echo "UPLOAD_DIR=." >> $GITHUB_ENV
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.UPLOAD_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
